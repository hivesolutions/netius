name: Flake Workflow
on: [push]
jobs:
  flake-loop:
    name: Flake Loop
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13", "3.14"]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: |
          pip install -r requirements.txt
          pip install -r extra.txt
      - run: python flake_repro.py
        env:
          COUNT: 400
  flake-suite:
    name: Flake Suite
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13", "3.14"]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: |
          pip install -r requirements.txt
          pip install -r extra.txt
          pip install pytest
      - run: |
          for index in 1 2 3 4 5 6; do
            echo "===== suite run $index ====="
            pytest src/netius/test -q --tb=long -k "not Integration" || exit 1
          done
        env:
          HTTPBIN: httpbin.bemisc.com
