name: Main Workflow
on: [push]
jobs:
  build:
    name: Build
    timeout-minutes: 10
    strategy:
      matrix:
        python-version: [
          2.7,
          3.5,
          3.6,
          3.7,
          3.8,
          3.9,
          "3.10",
          "3.11",
          "3.12",
          "3.13",
          "3.14",
          latest,
          rc
        ]
    runs-on: ubuntu-latest
    container: python:${{ matrix.python-version }}
    steps:
      - uses: actions/checkout@v7
      - run: python --version
      - run: |
          pip install -r requirements.txt
          pip install -r extra.txt
      - run: |
          pip install black
          black . --check
        if: matrix.python-version == '3.14'
      - run: |
          pip install pytest
          HTTPBIN=httpbin.bemisc.com pytest
      - run: HTTPBIN=httpbin.bemisc.com python setup.py test
        if: ${{ !contains(fromJson('["3.9", "3.10", "3.11", "3.12", "3.13", "3.14", "latest"]'), matrix.python-version) }}
  build-pypy:
    name: Build PyPy
    timeout-minutes: 10
    strategy:
      matrix:
        python-version: [2.7, 3.6, 3.9, "3.10", "3.11"]
    runs-on: ubuntu-latest
    container: pypy:${{ matrix.python-version }}
    steps:
      - uses: actions/checkout@v7
      - run: pypy --version
      - run: |
          pip install -r requirements.txt
          pip install -r extra.txt
      - run: |
          pip install black
          black . --check
        if: matrix.python-version == '3.14'
      - run: |
          pip install pytest
          HTTPBIN=httpbin.bemisc.com pytest
      - run: HTTPBIN=httpbin.bemisc.com pypy setup.py test
        if: ${{ !contains(fromJson('["3.9", "3.10", "3.11", "3.12", "3.13", "3.14", "latest"]'), matrix.python-version) }}
  build-windows:
    name: Build Windows
    timeout-minutes: 10
    strategy:
      matrix:
        python-version: [3.9, "3.11", "3.13", "3.14"]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: python --version
      - run: |
          pip install -r requirements.txt
          pip install -r extra.txt
      - run: |
          pip install pytest
          pytest
        env:
          HTTPBIN: httpbin.bemisc.com
  build-macos:
    name: Build macOS
    timeout-minutes: 10
    strategy:
      matrix:
        python-version: [3.9, "3.11", "3.13", "3.14"]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: python --version
      - run: |
          pip install -r requirements.txt
          pip install -r extra.txt
      - run: |
          pip install pytest
          pytest
        env:
          HTTPBIN: httpbin.bemisc.com
