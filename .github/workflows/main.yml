name: Main Workflow
on: [push]
jobs:
  build:
    name: Build
    timeout-minutes: 10
    strategy:
      matrix:
        python-version: [
          2.7,
          3.5,
          3.6,
          3.7,
          3.8,
          3.9,
          "3.10",
          "3.11",
          "3.12",
          "3.13",
          "3.14",
          latest,
          rc
        ]
    runs-on: ubuntu-latest
    container: python:${{ matrix.python-version }}
    steps:
      - uses: actions/checkout@v7
      - run: python --version
      - run: |
          pip install -r requirements.txt
          pip install -r extra.txt
      - run: |
          pip install black
          black . --check
        if: matrix.python-version == '3.14'
      - run: |
          pip install mypy
          PYTHONPATH=src python -m mypy.stubtest --allowlist stubtest.txt \
            --ignore-unused-allowlist \
            netius.adapters netius.auth netius.base netius.clients \
            netius.common netius.extra netius.middleware netius.mock \
            netius.pool netius.servers netius.sh
        if: matrix.python-version == '3.14'
      - run: |
          pip install pytest
          HTTPBIN=httpbin.bemisc.com pytest
      - run: HTTPBIN=httpbin.bemisc.com python setup.py test
        if: ${{ !contains(fromJson('["3.9", "3.10", "3.11", "3.12", "3.13", "3.14", "latest"]'), matrix.python-version) }}
  build-pypy:
    name: Build PyPy
    timeout-minutes: 10
    strategy:
      matrix:
        python-version: [2.7, 3.6, 3.9, "3.10", "3.11"]
    runs-on: ubuntu-latest
    container: pypy:${{ matrix.python-version }}
    steps:
      - uses: actions/checkout@v7
      - run: pypy --version
      - run: |
          pip install -r requirements.txt
          pip install -r extra.txt
      - run: |
          pip install black
          black . --check
        if: matrix.python-version == '3.14'
      - run: |
          pip install pytest
          HTTPBIN=httpbin.bemisc.com pytest
      - run: HTTPBIN=httpbin.bemisc.com pypy setup.py test
        if: ${{ !contains(fromJson('["3.9", "3.10", "3.11", "3.12", "3.13", "3.14", "latest"]'), matrix.python-version) }}
  build-windows:
    name: Build Windows
    timeout-minutes: 10
    strategy:
      matrix:
        python-version: [3.9, "3.11", "3.13", "3.14"]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: python --version
      - run: |
          pip install -r requirements.txt
          pip install -r extra.txt
      - run: |
          pip install pytest
          pytest
        env:
          HTTPBIN: httpbin.bemisc.com
  build-macos:
    name: Build macOS
    timeout-minutes: 10
    strategy:
      matrix:
        python-version: [3.9, "3.11", "3.13", "3.14"]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: python --version
      - run: |
          pip install -r requirements.txt
          pip install -r extra.txt
      - run: |
          pip install pytest
          pytest
        env:
          HTTPBIN: httpbin.bemisc.com
  coverage:
    name: Coverage
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - run: python --version
      - run: |
          pip install -r requirements.txt
          pip install -r extra.txt
      - run: |
          pip install pytest coverage
          coverage run -m pytest
        env:
          HTTPBIN: httpbin.bemisc.com
      - uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ matrix.os }}
          path: .coverage.*
          include-hidden-files: true
          retention-days: 14
  coverage-report:
    name: Coverage Report
    needs: coverage
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - uses: actions/download-artifact@v8
        with:
          pattern: coverage-*
          merge-multiple: true
      - run: |
          pip install coverage
          coverage combine
          coverage report --sort=-miss
      - run: |
          echo "## Coverage" >> $GITHUB_STEP_SUMMARY
          echo >> $GITHUB_STEP_SUMMARY
          coverage report --format=markdown --sort=-miss >> $GITHUB_STEP_SUMMARY
      - run: coverage html
      - uses: actions/upload-artifact@v7
        with:
          name: coverage-html
          path: htmlcov
          retention-days: 14
